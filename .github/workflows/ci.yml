name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app tests tools
      - run: python -m pytest -q
      - name: Validate frozen Retrieval V2 dataset
        run: >-
          python -c "from pathlib import Path; from app.evaluation.retrieval_v2 import
          load_retrieval_v2, validate_retrieval_v2, verify_retrieval_v2_manifest;
          p=Path('data/eval_dataset/job_retrieval_v2');
          assert verify_retrieval_v2_manifest(p)['valid'];
          assert validate_retrieval_v2(load_retrieval_v2(p))['valid']"
