services:
  api:
    build: .
    env_file: .env.docker
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ${MODEL_DIR:-./models}:/models:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

  ui:
    build: .
    env_file: .env.docker
    environment:
      BACKEND_URL: http://api:8000
    command: ["streamlit", "run", "streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
